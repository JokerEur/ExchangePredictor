tuning:
  scoring: mae
  huber_delta: 1.0
  huber_slope_short: 1.0
  huber_slope_long: 0.3
  search_n_jobs: -1
  cv_rules:
    small_train_threshold: 80
    medium_train_threshold: 160
    small_train_splits: 2
    medium_train_splits: 3
    default_splits: 3

ensemble:
  # Веса по умолчанию (используются если не переданы в запросе и не вычислены автоматически)
  default_weights:
    xgboost: 0.5
    arima: 0.25
    lstm: 0.25
  # Авто-взвешивание на основе метрик валидации (inverse-MAE)
  auto_weighting: true

models:
  arima:
    default_params:
      order: [5, 1, 0]

  lstm:
    default_params:
      sequence_len: 10
      hidden_size: 64
      num_layers: 2
      epochs: 30
      lr: 0.001
      batch_size: 32

  xgboost:
    default_params:
      n_estimators: 600
      learning_rate: 0.03
      max_depth: 6
      min_child_weight: 3
      subsample: 0.85
      colsample_bytree: 0.85
      gamma: 0.0
      reg_alpha: 0.0
      reg_lambda: 1.0
      objective: reg:pseudohubererror
      huber_slope: 1.0
      tree_method: hist
      random_state: 42
      n_jobs: -1
    search_space:
      n_estimators: [250, 400, 600, 850, 1100]
      learning_rate: [0.01, 0.02, 0.03, 0.05, 0.08]
      max_depth: [3, 4, 5, 6, 8]
      min_child_weight: [1, 2, 3, 5, 7]
      subsample: [0.65, 0.8, 0.9, 1.0]
      colsample_bytree: [0.6, 0.75, 0.85, 1.0]
      gamma: [0.0, 0.05, 0.1, 0.2]
      reg_alpha: [0.0, 0.001, 0.01, 0.05, 0.1]
      reg_lambda: [0.5, 1.0, 1.5, 2.0, 3.0]
      huber_slope: [0.1, 0.2, 0.3, 0.5, 1.0]
